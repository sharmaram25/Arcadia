<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6EE7FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Cabinet body -->
  <rect x="5" y="10" width="22" height="19" rx="2" ry="2" fill="#0B0F19" stroke="#1E2640" stroke-width="0.8"/>

  <!-- Cabinet top bezel (marquee area) -->
  <rect x="5" y="4" width="22" height="7" rx="2" ry="2" fill="#0F1528" stroke="#1E2640" stroke-width="0.8"/>

  <!-- ARCADIA text on marquee -->
  <text x="16" y="9.5" font-family="monospace" font-size="3.8" font-weight="bold" fill="#6EE7FF" text-anchor="middle" filter="url(#glow)" letter-spacing="0.5">ARCADIA</text>

  <!-- Screen bezel -->
  <rect x="8" y="12" width="16" height="11" rx="1.5" ry="1.5" fill="#060A14" stroke="#1E3040" stroke-width="0.6"/>

  <!-- Screen glow fill -->
  <rect x="8.8" y="12.8" width="14.4" height="9.4" rx="1" ry="1" fill="url(#screenGlow)"/>

  <!-- Screen scanlines (2 lines for effect) -->
  <line x1="9" y1="15.5" x2="23" y2="15.5" stroke="#6EE7FF" stroke-width="0.15" stroke-opacity="0.25"/>
  <line x1="9" y1="18.5" x2="23" y2="18.5" stroke="#6EE7FF" stroke-width="0.15" stroke-opacity="0.25"/>

  <!-- Screen 'A' symbol -->
  <text x="16" y="20.5" font-family="monospace" font-size="6.5" font-weight="bold" fill="#6EE7FF" text-anchor="middle" filter="url(#glow)">A</text>

  <!-- Control panel -->
  <rect x="7" y="23.5" width="18" height="4.5" rx="1" ry="1" fill="#0D1220" stroke="#1E2640" stroke-width="0.6"/>

  <!-- Joystick -->
  <circle cx="11.5" cy="25.75" r="1.5" fill="#1E2640" stroke="#2A3558" stroke-width="0.5"/>
  <circle cx="11.5" cy="25.75" r="0.7" fill="#6EE7FF" opacity="0.7"/>

  <!-- Buttons -->
  <circle cx="17" cy="25.75" r="1" fill="#FF4466" opacity="0.85"/>
  <circle cx="20" cy="25.75" r="1" fill="#6EE7FF" opacity="0.85"/>
  <circle cx="23" cy="25.75" r="1" fill="#A78BFA" opacity="0.85"/>

  <!-- Side accent lines -->
  <line x1="5" y1="14" x2="3.5" y2="14" stroke="#6EE7FF" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="5" y1="20" x2="3.5" y2="20" stroke="#6EE7FF" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="27" y1="14" x2="28.5" y2="14" stroke="#6EE7FF" stroke-width="0.5" stroke-opacity="0.4"/>
  <line x1="27" y1="20" x2="28.5" y2="20" stroke="#6EE7FF" stroke-width="0.5" stroke-opacity="0.4"/>
</svg>
